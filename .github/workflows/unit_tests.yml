name: Unit tests
on: [pull_request]

jobs:
  unit-tests-linux-x86_64:
    name: Unit tests (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
      
      - name: Create a fake init
        run: touch init/init
      
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo usermod -a -G kvm $USER

      - name: Unit tests
        run: cargo test

      - name: Virtio-net rate-limit tests
        run: cargo test --locked -p msb_krun_devices --features net virtio::net

      - name: Network builder rate-limit tests
        run: cargo test --locked -p msb_krun --features net network_rate_limiters

      - name: Linux nested-virt CPUID mask tests
        run: cargo test --locked --manifest-path src/cpuid/Cargo.toml filter_cpuid

      - name: Virtio descriptor consume test
        run: cargo test --locked -p msb_krun_devices writer_consume_truncates_the_final_slice

      # The block module builds only with the blk feature, so the plain `cargo test` above skips
      # it. Includes grow-ahead: first writes fill their chunk's holes, the cap, discard refills.
      - name: Virtio block tests
        run: cargo test --locked -p msb_krun_devices --features blk virtio::block

  unit-tests-windows-x86_64:
    name: Unit tests (Windows x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env

      - name: Windows errno translation tests
        run: cargo test --locked --manifest-path src/devices/Cargo.toml virtio::linux_errno::tests

      - name: Windows DAX default error test
        run: cargo test --locked --manifest-path src/devices/Cargo.toml virtio::fs::dyn_filesystem::tests

      - name: Windows passthrough error test
        run: cargo test --locked --manifest-path src/devices/Cargo.toml read_translates_zero_copy_win32_errors

      - name: Windows virtio descriptor consume test
        run: cargo test --locked --manifest-path src/devices/Cargo.toml writer_consume_truncates_the_final_slice

      # These decommit and recommit VirtualAlloc memory on the native runner.
      - name: Windows virtio-mem zeroing tests
        run: cargo test --locked --manifest-path src/devices/Cargo.toml zero_private_range

      - name: Windows virtio-mem unplug tests
        run: cargo test --locked --manifest-path src/devices/Cargo.toml virtio::mem

      # This calls VirtualAlloc2 on the native runner, not just the cross-compiled wrapper.
      - name: Windows NUMA allocation test
        run: cargo test --locked --manifest-path src/vmm/Cargo.toml windows_numa_mapping_allocates_accessible_memory

      - name: Windows eager restore memory test
        run: cargo test --locked --manifest-path src/vmm/Cargo.toml eager_restore_replaces_payload_bytes_without_losing_regions

      - name: Windows nested-virt CPUID mask tests
        run: cargo test --locked --manifest-path src/vmm/Cargo.toml normalize_cpuid

      # A guest flush on a raw image flushes through libkrun's own handle only; Imago's second
      # FlushFileBuffers is skipped. The test writes through both handles and reads the file back.
      - name: Windows block flush tests
        run: cargo test --locked --manifest-path src/devices/Cargo.toml --features blk guest_flush_persists

      - name: Windows device Clippy
        run: cargo clippy --locked --manifest-path src/devices/Cargo.toml -- -D warnings

